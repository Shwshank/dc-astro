name: Build and deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Astro website
        run: npm run build

      - name: Check Firebase deployment credential
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and validate Firebase credentials
        if: ${{ steps.firebase_auth.outputs.available == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credentials_file"
          python3 -m json.tool "$credentials_file" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        if: ${{ steps.firebase_auth.outputs.available == 'true' }}
        run: npm install --global firebase-tools@14.12.0 --no-audit --no-fund

      - name: Deploy pull request preview
        id: deploy_preview
        if: ${{ github.event_name == 'pull_request' && steps.firebase_auth.outputs.available == 'true' }}
        run: |
          set -o pipefail
          preview_log="$RUNNER_TEMP/firebase-preview.log"
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --expires 7d \
            --project delhi-concierge \
            --non-interactive | tee "$preview_log"

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.(web\.app|firebaseapp\.com)' "$preview_log" | tail -n 1 || true)"
          {
            echo "## Firebase preview"
            if [ -n "$preview_url" ]; then
              echo "[Open the preview]($preview_url)"
            else
              echo "The preview was deployed. Open this step's log to copy the Firebase preview URL."
            fi
            echo ""
            echo "This preview expires automatically after 7 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy main to Firebase Hosting
        if: ${{ github.event_name != 'pull_request' && steps.firebase_auth.outputs.available == 'true' }}
        run: |
          firebase deploy \
            --only hosting \
            --project delhi-concierge \
            --non-interactive

          {
            echo "## Production deployment"
            echo "[Open delhiconcierge.in](https://delhiconcierge.in)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped deployment
        if: ${{ steps.firebase_auth.outputs.available != 'true' }}
        run: echo "Build passed. Add FIREBASE_SERVICE_ACCOUNT_BASE64 to enable Firebase deployment."
